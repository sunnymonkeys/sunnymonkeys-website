---
deployment:
  tasks:
    - export DEPLOYPATH=/home1/marcome2/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R . $DEPLOYPATH
    - /bin/rm -rf $DEPLOYPATH/.git
    - /bin/rm -f $DEPLOYPATH/.cpanel.yml
    - /bin/rm -f $DEPLOYPATH/.gitignore
    - /bin/rm -rf $DEPLOYPATH/.github
    - /bin/rm -f $DEPLOYPATH/README.md
    - /bin/rm -f $DEPLOYPATH/CLAUDE.md
    - /bin/rm -rf $DEPLOYPATH/docs
    - /bin/rm -f $DEPLOYPATH/GLOSSARY.md
    - /bin/rm -rf $DEPLOYPATH/.scratch
